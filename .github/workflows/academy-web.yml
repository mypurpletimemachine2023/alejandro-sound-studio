name: Academy WASM build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify source provenance and retained legal notices
        shell: bash
        run: |
          set -euo pipefail
          base=$(python3 -c 'import json; print(json.load(open("ACA_FORK.json"))["upstreamCommit"])')
          git cat-file -e "$base^{commit}" 2>/dev/null || git fetch --no-tags origin "$base" --depth=1
          git diff --exit-code "$base" -- LICENSE-MIT LICENSE-APACHE NOTICE
          git diff --check "$base"
          test -f ACA_FORK.md
          if find docs/brand -type f | grep -Eq '[.](png|svg)$'; then
            echo 'Non-open upstream trademark artwork must not be bundled in the fork.' >&2
            exit 1
          fi
  browser-save-tests:
    needs: source-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust test toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Exercise self-contained copies and immutable revert checkpoints
        run: cargo test --locked -p soundcraft-engine browser_ --lib
      - name: Exercise standalone compact presentation policy
        run: |
          rustc --edition 2024 --test crates/ui-egui/src/compact_policy.rs -o "$RUNNER_TEMP/academy-compact-policy"
          "$RUNNER_TEMP/academy-compact-policy"
  build-web:
    needs: source-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      CARGO_PROFILE_RELEASE_OPT_LEVEL: s
      CARGO_TARGET_DIR: ${{ github.workspace }}/.aca-target
      WASM_BINDGEN_BIN: wasm-bindgen
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust WASM toolchain
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.95.0
      - name: Install matching official wasm-bindgen CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/academy-bindgen"
          curl --fail --location --retry 3 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/bindgen.tar.gz"
          tar -xzf "$RUNNER_TEMP/bindgen.tar.gz" -C "$RUNNER_TEMP/academy-bindgen" --strip-components=1
          "$RUNNER_TEMP/academy-bindgen/wasm-bindgen" --version
          echo "$RUNNER_TEMP/academy-bindgen" >> "$GITHUB_PATH"
      - name: Compile the modified Academy application
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest test_aca_packaging.py
          node --test test-academy-bootstrap.mjs
          python3 aca_build_web.py
      - name: Include licenses and exact source identity
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md ACA_FORK.json ACA_FORK.md dist/web/
          git rev-parse HEAD > dist/web/ACA_SOURCE_COMMIT.txt
          test -f dist/web/index.html
          find dist/web -name '*.wasm' -print -quit | grep -q .
          (cd dist/web && find . -type f -print0 | sort -z | xargs -0 sha256sum > ../academy-web-sha256.txt)
          cp dist/academy-web-sha256.txt dist/web/
      - uses: actions/upload-artifact@v4
        with:
          name: academy-web
          path: dist/web/
          if-no-files-found: error
          retention-days: 7
